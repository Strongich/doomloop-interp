# Minimal grant so a finished job pod can release its own GPUs.
# Scoped to one namespace and one verb: delete pods. Nothing else.
# This is deliberately narrower than mounting a kubeconfig into the pod, which
# would carry the user's full cluster access on a shared PVC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-self-delete
  namespace: vitenko-thesis
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-self-delete
  namespace: vitenko-thesis
subjects:
  - kind: ServiceAccount
    name: default
    namespace: vitenko-thesis
roleRef:
  kind: Role
  name: pod-self-delete
  apiGroup: rbac.authorization.k8s.io
