[project]
name = "reasoning-attention"
version = "0.1.0"
description = "Qwen3-1.7B (thinking mode) initialization + high-throughput vLLM serving."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "transformers>=4.51.0",
    "matplotlib>=3.8",
    # torch is left unpinned on purpose: vLLM pins a compatible torch and we let
    # it drive the version (the RTX 5070 Ti / Blackwell needs cu128 wheels).
    "torch",
    # vLLM >= 0.8.5 is the first line with solid Blackwell (sm_120) support.
    "vllm>=0.8.5",
    "huggingface-hub>=0.30",
    "rich>=13.0",
    "accelerate>=0.26",
    "datasets>=2.19",
    # Explanation authoring for the SFT warm-start runs through the OpenAI
    # Responses API; the key is read from .env.
    "openai>=1.100",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "peft>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_attention"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (includes unused imports/variables, ex-autoflake)
    "I",   # isort (import sorting, ex-isort)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# Verbatim AV/AR prompt templates - must not be line-wrapped.
"src/reasoning_attention/nla/prompts.py" = ["E501"]
# Verbatim explainer instruction prompt - must not be line-wrapped.
"src/reasoning_attention/datagen/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["reasoning_attention"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
